<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cleen.cpp — chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b100e; --elev:#121815; --sunken:#0e1311;
  --ink:#e8f1ec; --soft:#9fb0a7; --faint:#6b7a72;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --clean:#3fe0a6; --clean-soft:rgba(63,224,166,.12);
  --gold:#ecc887;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid var(--line);background:var(--elev);flex:0 0 auto;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:-.01em}
.logo b{color:var(--clean)}
select{font-family:var(--sans);font-size:.82rem;background:var(--sunken);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:.34rem .5rem;cursor:pointer}
select:focus{outline:none;border-color:var(--clean)}
.ctl{display:flex;align-items:center;gap:.35rem}
.ctl label{font-size:.68rem;color:var(--faint);font-family:var(--mono)}
.tog{display:flex;align-items:center;gap:.4rem;font-size:.76rem;color:var(--soft);cursor:pointer;user-select:none}
.tog input{appearance:none;width:34px;height:19px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto}
.tog input:checked{background:var(--clean)}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked::after{transform:translateX(15px)}
.route{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--faint);display:flex;align-items:center;gap:.4em}
.route .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.route.on .dot{background:var(--clean);box-shadow:0 0 8px var(--clean)}
.route.cloud .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
main{flex:1 1 auto;overflow-y:auto;padding:1.1rem .9rem;display:flex;flex-direction:column;gap:.9rem}
.wrap{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:.9rem}
.msg{display:flex;gap:.7rem;line-height:1.5}
.msg .who{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.7rem;font-weight:600;font-family:var(--mono)}
.msg.u .who{background:var(--clean-soft);color:var(--clean)}
.msg.a .who{background:#1c2420;color:var(--gold)}
.msg .body{flex:1 1 auto;white-space:pre-wrap;word-wrap:break-word;padding-top:.28rem;min-width:0}
.msg.a .body{color:#dbe7e0}
.msg.sys .body{color:var(--faint);font-size:.85rem;font-style:italic}
.acts{font-family:var(--mono);font-size:.72rem;color:var(--clean);margin-top:.4rem;opacity:.9}
.acts .x{color:var(--faint)}
.cursor{display:inline-block;width:7px;height:1.05em;background:var(--clean);vertical-align:text-bottom;animation:bl 1s steps(2) infinite;margin-left:1px}
@keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}
footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--elev);padding:.7rem .9rem}
.inrow{max-width:820px;margin:0 auto;display:flex;gap:.6rem;align-items:flex-end}
textarea{flex:1 1 auto;resize:none;background:var(--sunken);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:.7rem .85rem;font-family:var(--sans);font-size:.95rem;line-height:1.4;max-height:160px;min-height:46px}
textarea:focus{outline:none;border-color:var(--clean)}
button{font-family:var(--sans);font-weight:600;border:none;border-radius:11px;padding:.7rem 1.1rem;cursor:pointer}
.send{background:var(--clean);color:#04140d}
.send:disabled{opacity:.4;cursor:default}
.stop{background:#2a1414;color:#ff9a9a}
.hint{max-width:820px;margin:.5rem auto 0;font-family:var(--mono);font-size:.66rem;color:var(--faint);text-align:center}
</style>
</head>
<body>
<header>
  <span class="logo">cleen<b>.cpp</b></span>
  <div class="ctl">
    <label>model</label>
    <select id="model"></select>
  </div>
  <div class="ctl">
    <label>run</label>
    <select id="mode">
      <option value="local">local (free/private)</option>
      <option value="auto">auto</option>
      <option value="fast">fast (cloud)</option>
      <option value="cloud">cloud</option>
    </select>
  </div>
  <label class="tog" title="Let the model actually use your computer: open sites, run commands, search, screenshot.">
    <input type="checkbox" id="tools" checked> computer control
  </label>
  <span class="route" id="route"><span class="dot"></span><span id="routeTxt">ready</span></span>
</header>
<main id="main">
  <div class="wrap" id="stream">
    <div class="msg sys"><div class="who">i</div><div class="body" id="welcome"></div></div>
  </div>
</main>
<footer>
  <div class="inrow">
    <textarea id="box" placeholder="Talk to it, or tell it to do something on your computer…  (Enter to send, Shift+Enter = new line)" autofocus></textarea>
    <button class="send" id="send">Send</button>
    <button class="stop" id="stop" hidden>Stop</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>
<script>
(function(){
  var ENDPOINT = "http://127.0.0.1:8088/v1/chat/completions";
  var MODELS = [
    { id:"cleen-chat",       label:"cleen-chat — general chat & reasoning",      local:false },
    { id:"cleen-coder",      label:"cleen-coder — fast coder (fits 6GB)",         local:false },
    { id:"cleen-coder-max",  label:"cleen-coder-max — big MoE coder",             local:false },
    { id:"cleen-uncensored", label:"cleen-uncensored — Qwen3.8-27B (local only)", local:true  }
  ];
  var stream=document.getElementById("stream"), main=document.getElementById("main");
  var box=document.getElementById("box"), send=document.getElementById("send"), stop=document.getElementById("stop");
  var modelSel=document.getElementById("model"), modeSel=document.getElementById("mode"), toolsChk=document.getElementById("tools");
  var routeEl=document.getElementById("route"), routeTxt=document.getElementById("routeTxt");
  var welcome=document.getElementById("welcome"), hint=document.getElementById("hint");
  var history=[], controller=null, busy=false;

  // build model dropdown
  MODELS.forEach(function(m){
    var o=document.createElement("option"); o.value=m.id; o.textContent=m.label; modelSel.appendChild(o);
  });
  modelSel.value = "cleen-chat";

  function curModel(){ return MODELS.filter(function(m){return m.id===modelSel.value;})[0] || MODELS[0]; }
  function localOnly(){ return curModel().local; }

  // a local-only model forces local mode (it has no cloud twin)
  function syncMode(){
    if(localOnly()){ modeSel.value="local"; modeSel.disabled=true; }
    else { modeSel.disabled=false; }
    updateHint();
  }
  function updateHint(){
    hint.textContent = "model: "+modelSel.value+"  ·  run: "+modeSel.value
      + (toolsChk.checked ? "  ·  computer control ON" : "  ·  chat only")
      + "  ·  127.0.0.1:8088";
  }
  modelSel.addEventListener("change", function(){ syncMode(); });
  modeSel.addEventListener("change", updateHint);
  toolsChk.addEventListener("change", updateHint);
  syncMode();
  welcome.textContent = "Pick a model up top. With computer control ON, tell it to DO things — \"open youtube and play bad bunny\", \"take a screenshot\", \"what files are in the install folder\" — and it actually does them on this machine, then tells you. Turn it off for plain chat. The uncensored model runs fully local; nothing you type leaves your computer.";

  function scroll(){ main.scrollTop = main.scrollHeight; }
  function addMsg(role, text){
    var cls = role==="user" ? "u" : (role==="assistant" ? "a" : "sys");
    var who = role==="user" ? "you" : (role==="assistant" ? "AI" : "i");
    var el=document.createElement("div"); el.className="msg "+cls;
    var w=document.createElement("div"); w.className="who"; w.textContent=who;
    var b=document.createElement("div"); b.className="body"; b.textContent=text||"";
    el.appendChild(w); el.appendChild(b); stream.appendChild(el); scroll();
    return b;
  }
  function setRoute(route){
    if(!route) return;
    routeTxt.textContent=route; routeEl.classList.add("on");
    routeEl.classList.toggle("cloud", /cloud/i.test(route));
  }
  function showActions(bodyNode, actions){
    if(!actions || !actions.length) return;
    var line=document.createElement("div"); line.className="acts";
    var txt = actions.map(function(a){
      var name = a && (a.tool||a.name||a.action) || "tool";
      var arg = a && (a.args||a.arguments||a.input);
      var detail = "";
      if(arg && typeof arg==="object"){
        var v = arg.url||arg.app||arg.command||arg.query||arg.path||arg.text;
        if(v) detail = String(v).slice(0,60);
      }
      return "↳ "+name+(detail?(" "+detail):"");
    }).join("   ");
    line.textContent = txt;
    bodyNode.parentElement.appendChild(line); scroll();
  }
  function setBusy(v){ busy=v; send.disabled=v; stop.hidden=!v; }

  function sendMsg(){
    var text=box.value.trim(); if(!text||busy) return;
    box.value=""; box.style.height="auto";
    addMsg("user", text);
    history.push({ role:"user", content:text });

    var bodyNode=addMsg("assistant","");
    var cur=document.createElement("span"); cur.className="cursor"; bodyNode.appendChild(cur);
    var acc="", actionsShown=false;
    setBusy(true);
    var useTools = toolsChk.checked;
    routeTxt.textContent = useTools ? "working… (it may be using the computer)" : "thinking…";
    controller = ("AbortController" in window) ? new AbortController() : null;

    var bodyObj = { model: modelSel.value, mode: modeSel.value, messages: history, stream: true };
    if(useTools) bodyObj.cleen_tools = true;   // <- engages the agent layer (computer control)
    var headers = { "content-type":"application/json", "X-Cleen-Mode": modeSel.value };
    if(useTools) headers["X-Cleen-Tools"] = "1";

    fetch(ENDPOINT, { method:"POST", headers:headers, body:JSON.stringify(bodyObj),
                      signal: controller?controller.signal:undefined })
    .then(function(res){
      if(!res.ok){
        return res.json().then(function(j){
          var m=(j&&j.error&&j.error.message)||("HTTP "+res.status);
          cur.remove(); bodyNode.textContent="⚠ "+m; bodyNode.parentElement.className="msg sys";
          setBusy(false); history.pop();
        }, function(){ cur.remove(); bodyNode.textContent="⚠ cleen.cpp did not respond. Is :8088 up?"; bodyNode.parentElement.className="msg sys"; setBusy(false); history.pop(); });
      }
      var reader=res.body.getReader(), dec=new TextDecoder(), buf="";
      function pump(){
        return reader.read().then(function(step){
          if(step.done){ finish(); return; }
          buf += dec.decode(step.value,{stream:true});
          var nl;
          while((nl=buf.indexOf("\n"))>=0){
            var line=buf.slice(0,nl); buf=buf.slice(nl+1);
            line=line.replace(/\r$/,"").trim();
            if(!line||line.charAt(0)===":") continue;
            if(line.indexOf("data:")!==0) continue;
            var payload=line.slice(5).trim();
            if(payload==="[DONE]"){ finish(); return; }
            var obj; try{ obj=JSON.parse(payload); }catch(e){ continue; }
            if(obj&&obj.cleen){
              if(obj.cleen.route) setRoute(obj.cleen.route);
              if(!actionsShown && obj.cleen.tools && obj.cleen.tools.length){ showActions(bodyNode, obj.cleen.tools); actionsShown=true; }
            }
            var ch=obj&&obj.choices&&obj.choices[0];
            var piece=ch&&ch.delta&&ch.delta.content;
            if(piece){ acc+=piece; bodyNode.textContent=acc; bodyNode.appendChild(cur); scroll(); }
          }
          return pump();
        });
      }
      function finish(){
        cur.remove();
        if(acc){ history.push({ role:"assistant", content:acc }); }
        else { bodyNode.textContent="(done — no text reply)"; bodyNode.parentElement.classList.remove("a"); bodyNode.parentElement.classList.add("sys"); history.pop(); }
        setBusy(false); box.focus();
      }
      return pump();
    })
    .catch(function(e){
      cur.remove();
      if(e&&e.name==="AbortError"){ bodyNode.textContent=acc+"  ⏹ stopped"; if(acc) history.push({role:"assistant",content:acc}); else history.pop(); }
      else { bodyNode.textContent="⚠ connection failed — is cleen.cpp running on :8088?"; bodyNode.parentElement.className="msg sys"; history.pop(); }
      setBusy(false);
    });
  }

  send.addEventListener("click", sendMsg);
  stop.addEventListener("click", function(){ if(controller) controller.abort(); });
  box.addEventListener("keydown", function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMsg(); }});
  box.addEventListener("input", function(){ box.style.height="auto"; box.style.height=Math.min(box.scrollHeight,160)+"px"; });
})();
</script>
</body>
</html>
